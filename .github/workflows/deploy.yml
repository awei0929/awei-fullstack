name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy this main commit or roll back to an installed release
        required: true
        type: choice
        default: deploy
        options: [deploy, rollback]
      release_id:
        description: Installed release ID (required only for rollback)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate main and release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.release.outputs.action }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Validate branch and requested operation
        id: release
        env:
          SOURCE_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_ACTION: ${{ inputs.action || 'deploy' }}
          REQUESTED_RELEASE: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == refs/heads/main ]] || { echo 'Only main can deploy or roll back.' >&2; exit 1; }
          case "$REQUESTED_ACTION" in
            deploy) release_id="${COMMIT_SHA}-${RUN_ID}-${RUN_ATTEMPT}" ;;
            rollback) release_id="$REQUESTED_RELEASE" ;;
            *) echo 'Unsupported operation.' >&2; exit 1 ;;
          esac
          [[ "$release_id" =~ ^[a-zA-Z0-9-]{1,128}$ ]] || { echo 'Release ID must be 1–128 letters, digits or hyphens.' >&2; exit 1; }
          printf 'action=%s\nrelease_id=%s\n' "$REQUESTED_ACTION" "$release_id" >> "$GITHUB_OUTPUT"
          printf 'Operation: %s\nCommit: %s\nRelease: %s\n' "$REQUESTED_ACTION" "$COMMIT_SHA" "$release_id"

  build:
    name: Build and test
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    services:
      mongodb:
        image: mongo:8.0
        env:
          # Temporary rseq/kernel workaround: https://github.com/docker-library/mongo/discussions/748
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nest_ci
      NODE_ENV: test
      SESSION_SECRET: ci-only-test-secret-at-least-32-characters
    steps:
      - name: Initialize build log
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy-logs/build"
          printf 'Commit: %s\nRelease: %s\n' "$COMMIT_SHA" "$RELEASE_ID" | tee "$RUNNER_TEMP/deploy-logs/build/context.log"

      - name: Check out the exact triggering commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the restricted deployment handler
        id: deployment_test
        run: |
          set -euo pipefail
          python3 scripts/test-deploy.py 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/deployment-test.log"

      - name: Install frontend dependencies
        id: frontend_install
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/frontend-install.log"

      - name: Lint frontend
        id: frontend_lint
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/frontend-lint.log"

      - name: Build frontend
        id: frontend_build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/frontend-build.log"

      - name: Install backend dependencies
        id: backend_install
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/backend-install.log"

      - name: Build backend and run isolated MongoDB HTTP tests
        id: backend_test
        working-directory: backend
        env:
          SITE_ASSETS_DIR: ${{ runner.temp }}/nest-ci-assets
        run: |
          set -euo pipefail
          # Checkout never supplies the server .env; each test uses its own awei_e2e_UUID database.
          {
            [[ ! -e .env ]] || { echo 'A real backend .env must never be used by CI.' >&2; exit 1; }
            npm test
          } 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/backend-test.log"

      - name: Package the release whitelist
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/deploy-logs/build/package.log"
          import hashlib
          import os
          from pathlib import Path
          import stat
          import tarfile

          roots = [Path('backend/dist'), Path('backend/package.json'), Path('backend/package-lock.json'), Path('frontend/dist')]
          for root in roots:
              if not root.exists() or root.is_symlink():
                  raise SystemExit(f'Missing or unsafe build input: {root}')
              entries = [root, *root.rglob('*')] if root.is_dir() else [root]
              for entry in entries:
                  if any(part == 'node_modules' or part == '.env' or part.startswith('.env.') for part in entry.parts):
                      raise SystemExit(f'Forbidden archive member: {entry}')
                  mode = entry.lstat().st_mode
                  if not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise SystemExit(f'Only regular files and directories are allowed: {entry}')
          archive = Path(os.environ['RUNNER_TEMP']) / 'release/release.tar.gz'
          with tarfile.open(archive, 'w:gz') as bundle:
              for root in roots:
                  bundle.add(root, arcname=root.as_posix())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'archive_sha256={digest}\n')
          print(f'Archive: release.tar.gz\nSHA256: {digest}\nBytes: {archive.stat().st_size}')
          PY

      - name: Upload release for the deploy job
        id: release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/release.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build logs even after failure
        id: build_logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-logs/build
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize build
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE: ${{ steps.node.outcome }}
          DEPLOYMENT_TEST: ${{ steps.deployment_test.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          BACKEND_TEST: ${{ steps.backend_test.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          LOG_URL: ${{ steps.build_logs.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf '## Build\n\nCommit: `%s`  \nRelease: `%s`\n\n' "$COMMIT_SHA" "$RELEASE_ID"
            printf '| Step | Result |\n| --- | --- |\n'
            printf '| Checkout | %s |\n| Set up Node 24 | %s |\n| Deployment handler tests | %s |\n' "$CHECKOUT" "$NODE" "$DEPLOYMENT_TEST"
            printf '| Frontend install | %s |\n| Frontend lint | %s |\n| Frontend build | %s |\n' "$FRONTEND_INSTALL" "$FRONTEND_LINT" "$FRONTEND_BUILD"
            printf '| Backend install | %s |\n| Backend build and tests | %s |\n| Package | %s |\n\n' "$BACKEND_INSTALL" "$BACKEND_TEST" "$PACKAGE"
            printf '[View live step logs](%s)\n\n' "$RUN_URL"
            [[ -z "$LOG_URL" ]] || printf '[Download build logs](%s)\n\n' "$LOG_URL"
            [[ -z "$RELEASE_URL" ]] || printf '[Download release archive](%s)\n' "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy or roll back
    needs: [validate, build]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      (needs.validate.outputs.action == 'rollback' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Initialize deployment log
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          OPERATION: ${{ needs.validate.outputs.action }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy-logs/deploy"
          printf 'Operation: %s\nCommit: %s\nRelease: %s\n' "$OPERATION" "$COMMIT_SHA" "$RELEASE_ID" | tee "$RUNNER_TEMP/deploy-logs/deploy/context.log"

      - name: Download the checked release archive
        id: download
        if: needs.validate.outputs.action == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error

      - name: Verify release checksum
        id: checksum
        if: needs.validate.outputs.action == 'deploy'
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Missing build checksum.' >&2; exit 1; }
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/release/release.tar.gz" | sha256sum --check 2>&1 | tee "$RUNNER_TEMP/deploy-logs/deploy/checksum.log"

      - name: Publish through the restricted SSH command
        id: publish
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          OPERATION: ${{ needs.validate.outputs.action }}
        run: |
          set -euo pipefail
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/nest-deploy-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          publish() {
            [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'Deployment key or verified known_hosts is missing.' >&2; return 1; }
            [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo 'Invalid deployment host.' >&2; return 1; }
            [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid deployment user.' >&2; return 1; }
            [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 )) || { echo 'Invalid deployment port.' >&2; return 1; }
            [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9-]{1,128}$ ]] || { echo 'Invalid release ID.' >&2; return 1; }
            [[ "$OPERATION" == deploy || "$OPERATION" == rollback ]] || { echo 'Invalid operation.' >&2; return 1; }
            umask 077
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
            ssh_options=(
              -T -i "$ssh_dir/key" -p "$DEPLOY_PORT"
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
              -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null
              -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
              -o ClearAllForwardings=yes -o ForwardAgent=no -o RequestTTY=no
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
            )
            printf 'Starting %s for release %s\n' "$OPERATION" "$RELEASE_ID"
            if [[ "$OPERATION" == deploy ]]; then
              ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_ID" < "$RUNNER_TEMP/release/release.tar.gz"
            else
              ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rollback $RELEASE_ID" < /dev/null
            fi
          }
          publish 2>&1 | tee "$RUNNER_TEMP/deploy-logs/deploy/publish.log"

      - name: Upload deployment logs even after failure
        id: deploy_logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-logs/deploy
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize deployment
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          OPERATION: ${{ needs.validate.outputs.action }}
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECKSUM: ${{ steps.checksum.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          LOG_URL: ${{ steps.deploy_logs.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf '## Deployment\n\nOperation: `%s`  \nTrigger commit: `%s`  \nRelease: `%s`\n\n' "$OPERATION" "$COMMIT_SHA" "$RELEASE_ID"
            printf '| Step | Result |\n| --- | --- |\n| Download archive | %s |\n| Verify archive | %s |\n| Restricted SSH command | %s |\n\n' "$DOWNLOAD" "$CHECKSUM" "$PUBLISH"
            printf '[View live step logs](%s)\n\n' "$RUN_URL"
            [[ -z "$LOG_URL" ]] || printf '[Download deployment logs](%s)\n' "$LOG_URL"
          } >> "$GITHUB_STEP_SUMMARY"
